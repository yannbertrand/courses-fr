name: Build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - name: Snapshot previous events.json
        run: |
          if [ -f dist/events.json ]; then
            cp dist/events.json /tmp/events.old.json
          else
            echo '[]' > /tmp/events.old.json
          fi
      - name: Install dependencies
        run: npm i --prefer-offline
      - name: Build
        run: npm run build
      - id: check-empty-file
        name: Interrupt workflow
        run: |
          set +e
          git diff --quiet dist/events.json
          DIFF_EXIT_CODE=$?
          set -e

          if [ $DIFF_EXIT_CODE -ne 0 ]; then
              echo "events.json has changed"
              echo "do-commit=true" >> $GITHUB_OUTPUT
          else
              echo "events.json has not changed"
              echo "do-commit=false" >> $GITHUB_OUTPUT
          fi
      - id: event-stats
        name: Compute event stats
        if: steps.check-empty-file.outputs.do-commit == 'true'
        run: |
          node --input-type=module << 'EOF' >> "$GITHUB_OUTPUT"
          import { readFile } from 'node:fs/promises';

          const oldEvents = JSON.parse(await readFile('/tmp/events.old.json', 'utf8'));
          const newEvents = JSON.parse(await readFile('dist/events.json', 'utf8'));

          const linkKey = (e) => e.eventLink || e.registrationLink || null;
          const normalize = (s) => (s ?? '').trim().toLowerCase();
          const nameKey = (e) => `${normalize(e.name)}|${e.beginning}`;
          const cityKey = (e) => `${normalize(e.city)}|${e.beginning}`;

          const oldByLink = new Map(oldEvents.map((e) => [linkKey(e), e]).filter(([k]) => k));
          const newByLink = new Map(newEvents.map((e) => [linkKey(e), e]).filter(([k]) => k));

          let added = 0, modified = 0;
          const oldOrphans = [];
          const newOrphans = [];

          // Passe 1 : matching par lien
          for (const [k, e] of newByLink) {
            const old = oldByLink.get(k);
            if (!old) newOrphans.push(e);
            else if (JSON.stringify(old) !== JSON.stringify(e)) modified++;
          }
          for (const [k, e] of oldByLink) {
            if (!newByLink.has(k)) oldOrphans.push(e);
          }

          // Passes 2 et 3 : matching des orphelins par clé de secours
          const matchOrphans = (keyFn) => {
            const oldByKey = new Map();
            for (const e of oldOrphans) {
              if (e._matched) continue;
              const k = keyFn(e);
              if (!oldByKey.has(k)) oldByKey.set(k, e);
            }
            for (const e of newOrphans) {
              if (e._matched) continue;
              const old = oldByKey.get(keyFn(e));
              if (old) {
                old._matched = e._matched = true;
                modified++;
              }
            }
          };

          matchOrphans(nameKey); // nom + date
          matchOrphans(cityKey); // ville + date

          added = newOrphans.filter((e) => !e._matched).length;
          const removed = oldOrphans.filter((e) => !e._matched).length;

          console.log(`commit-msg=📦️ Sync events.json (+${added} added, ~${modified} modified, -${removed} removed)`);
          EOF
      - uses: test-room-7/action-update-file@v2.1.0
        if: steps.check-empty-file.outputs.do-commit == 'true'
        with:
          file-path: dist/events.json
          commit-msg: ${{ steps.event-stats.outputs.commit-msg || '📦️ Sync events.json' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

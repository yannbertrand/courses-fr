name: Build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - name: Snapshot previous events.json
        run: |
          if [ -f dist/events.json ]; then
            cp dist/events.json /tmp/events.old.json
          else
            echo '[]' > /tmp/events.old.json
          fi
      - name: Install dependencies
        run: npm i --prefer-offline
      - name: Build
        run: npm run build
      - id: check-empty-file
        name: Interrupt workflow
        run: |
          set +e
          git diff --quiet dist/events.json
          DIFF_EXIT_CODE=$?
          set -e

          if [ $DIFF_EXIT_CODE -ne 0 ]; then
              echo "events.json has changed"
              echo "do-commit=true" >> $GITHUB_OUTPUT
          else
              echo "events.json has not changed"
              echo "do-commit=false" >> $GITHUB_OUTPUT
          fi
      - id: event-stats
        name: Compute event stats
        if: steps.check-empty-file.outputs.do-commit == 'true'
        run: |
          node --input-type=module << 'EOF' >> "$GITHUB_OUTPUT"
          import { readFile } from 'node:fs/promises';

          const oldEvents = JSON.parse(await readFile('/tmp/events.old.json', 'utf8'));
          const newEvents = JSON.parse(await readFile('dist/events.json', 'utf8'));

          const key = (e) => e.eventLink ?? e.registrationLink;

          const oldByKey = new Map(oldEvents.map((e) => [key(e), JSON.stringify(e)]));
          const newByKey = new Map(newEvents.map((e) => [key(e), JSON.stringify(e)]));

          let added = 0, removed = 0, modified = 0;
          for (const [k, json] of newByKey) {
            if (!oldByKey.has(k)) added++;
            else if (oldByKey.get(k) !== json) modified++;
          }
          for (const k of oldByKey.keys()) {
            if (!newByKey.has(k)) removed++;
          }

          console.log(`commit-msg=📦️ Sync events.json (+${added} added, ~${modified} modified, -${removed} removed)`);
          EOF
      - uses: test-room-7/action-update-file@v2.1.0
        if: steps.check-empty-file.outputs.do-commit == 'true'
        with:
          file-path: dist/events.json
          commit-msg: ${{ steps.event-stats.outputs.commit-msg || '📦️ Sync events.json' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
